<div class="modal-header">
  <h1 mat-dialog-title class="modal-heading">Add Activity</h1>
  <button type="button" class="btn" mat-dialog-close (click)="onCloseClick()">
    <i class="fa fa-times"></i>
  </button>
</div>

<mat-dialog-content class="mat-typography dialog-body">
  <app-activity-form
    [activityOptions]="activityOptions"
    [accountDetailsOptions]="accountDetailsOptions"
    mode="bulk"
    (submitForm)="handleBulkSubmit($event)"
    (cancel)="dialogRef.close()"
  >
  </app-activity-form>
</mat-dialog-content>
