  
<div>
  <span mat-dialog-title>Edit Requirement</span>
  <div>

  <div class="input-container">
    <label for="input1">Position to be filled</label>
    <input style="width: -webkit-fill-available;" id="input1" type="number" [(ngModel)]="positionToBeFilled">
  </div>
  <div class="input-container">
    <label for="input2">Drop Ratio</label>
    <input style="width: -webkit-fill-available;" id="input2" type="number" [(ngModel)]="dropRatio">
  </div>
  <div class="input-container">
    <label for="input3">Offer to be rolled</label>
    <input style="width: -webkit-fill-available;" id="input3" type="number" [(ngModel)]="offersToBeRolledOut">
  </div>
  <div class="input-container" *ngIf="l1Visible">
    <label for="input3">L1 selection ratio</label>
    <input style="width: -webkit-fill-available;" id="input3" type="number" [(ngModel)]="l1SelectionRatio">
  </div>
  <div class="input-container" *ngIf="gkVisible">
    <label for="input3">GK selection ratio</label>
    <input style="width: -webkit-fill-available;" id="input3" type="number" [(ngModel)]="gkSelectionRatio">
  </div>

</div>
<div class="button-container">
    <button class="save-button" (click)="save()">Save</button>
    <button class="cancel-button" (click)="close()">Cancel</button>
  </div>
</div>
