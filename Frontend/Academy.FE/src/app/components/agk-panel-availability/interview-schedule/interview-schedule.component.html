<div class="container">
  <div class="page-inner">
    <h3 class="fw-bold mb-3 title" style="display: inline-block; margin-right: 700px;">{{ pageHeader }}</h3>
    
      <mf-app-panel-search-bar 
        (search)="onSearch($event)"
        (resetFilters)="onResetFilters($event)">
      </mf-app-panel-search-bar>
    
      <div class="row">
        <div class="col-md-12">
          <div class="card"
            [class.sideNavInActive]="!isSideNavActive"
            [ngClass]="{ sideNavActive: isSideNavActive }">
            <app-heatmap-table
              [reloadSubject]="reloadSubject"
              [panelists]="panelList"
              [slotDateRange]="slotDateRange">
            </app-heatmap-table>
          </div>
        </div>
      </div>

  </div>
</div>
