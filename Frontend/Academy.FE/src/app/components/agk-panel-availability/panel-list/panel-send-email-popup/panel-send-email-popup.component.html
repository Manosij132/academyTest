<div class="modal-header">
  <h2 mat-dialog-title class="modal-heading">Send Mail</h2>
  <button type="button" class="btn" mat-dialog-close>
      <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</div>
<div class = padding_left_right>
    <div>
        <div > 
            <b>To:</b>  {{sendEmailModel.globerEmail}} 
        </div>
        <div >
            <b>CC:</b>  {{sendEmailModel.globerLeaderEmail}}        
        </div>
        <div class="padding_top">
            <input type="text" class="form-control" placeholder="Subject" [(ngModel)]="sendEmailModel.subject" />
        </div>
        <div class="padding_top">
            <textarea class="form-control" placeholder="Message" [(ngModel)]="sendEmailModel.body" rows="10"></textarea>
        </div>
    </div>
    <mat-dialog-actions style="text-align: right; display: block;">
        <div>
            <button hidden mat-raised-button class="send-button"  mat-button mat-dialog-close (click)="sendEmail(sendEmailModel)">Send Mail</button>
            <button mat-button mat-dialog-close class="cancel-button">Cancel</button>
        </div>
        
      </mat-dialog-actions>
</div>
