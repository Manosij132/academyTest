<div class="modal-header">
  <h2 mat-dialog-title class="modal-heading">View Slots</h2>
  <button type="button" class="btn" mat-dialog-close>
      <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</div>
<mat-dialog-content>
  <p>{{ data.panelName }}</p>
  <div class="popup_table">
    <div class="popup_cal_calender">
      <div id="calendar"></div>
    </div>
    <div class="popup_cal_info" style="padding-left: 50px;">
      <div>
        <span class="red_dot"></span> Utilized
      </div>
      <div>
        <span class="green_dot"></span> Unutilized
      </div>
      <div>
        <span class="grey_dot"></span> Deficit
      </div>
    </div>
  </div>
  
</mat-dialog-content>
<mat-dialog-actions style="text-align: right;display: block;">
  
  <button mat-button mat-dialog-close type="button" mat-raised-button class="ok-button">
    Ok
  </button>
</mat-dialog-actions>
