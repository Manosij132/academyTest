<h2 mat-dialog-title> Email Preview  </h2>
<mat-dialog-content>
  <div class="preview-panel">
    @if (htmlPreview) {
      <span [innerHtml]="htmlPreview"></span>
    } @else {
      <span>
        Due to the large number of rows, previewing the data here isn't
        feasible. We've emailed you a Google Drive link to access the full
        dataset.
      </span>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-stroked-button type="button" color="primary" (click)="onCancel()">
    Close
  </button>
</mat-dialog-actions>
