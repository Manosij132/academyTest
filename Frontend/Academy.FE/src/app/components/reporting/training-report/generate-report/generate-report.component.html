<div class="container">
    <div class="row">
        <div class="card-body" *ngIf="paginatedData.length > 0">
            <div class="table-container">
                <table mat-table [dataSource]="paginatedData" class="mat-elevation-z8 mw-100">
                    <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
                        <th mat-header-cell *matHeaderCellDef 
                         [style.background-color]="color"
                         [class.numeric-column]="isNumeric(column)">{{ column }}
                        </th>
                        <td mat-cell *matCellDef="let element" 
                        [class.numeric-column]="isNumeric(element[column])">{{
                            element[column]
                            }}</td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
            <mat-paginator *ngIf="paginatedData.length > 0" [length]="data.length" [pageSize]="pageSize"
                [pageSizeOptions]="[5, 10, 20]" (page)="onPageChange($event)">
            </mat-paginator>
        </div>
        <div class="card-body text-center" *ngIf="paginatedData.length === 0">
            No records found. Please adjust your filter settings.
        </div>
    </div>
</div>
