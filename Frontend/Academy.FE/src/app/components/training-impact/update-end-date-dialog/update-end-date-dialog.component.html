<div class="modal-header">
  <h1 mat-dialog-title class="modal-heading">Update End Date</h1>
  <button type="button" class="btn" mat-dialog-close>
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</div>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="mat-typography dialog-body">
    <mat-form-field appearance="outline" class="full-width">
      <!-- <mat-label>End Date</mat-label> -->
      <input
        required
        matInput
        [matDatepicker]="endPicker"
        [(ngModel)]="newActivity.endDate"
        formControlName="endDate"
        placeholder="End Date"
        [min]="minDate"
      />
      <mat-datepicker-toggle
        matSuffix
        [for]="endPicker"
      ></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
      <mat-error
        *ngIf="
          formControls['endDate'].invalid && formControls['endDate'].touched
        "
        class="text-danger"
      >
        End date is required.
      </mat-error>
    </mat-form-field>
    <hr />
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button class="btn btn-primary" [disabled]="form.invalid" type="submit">
      Save
    </button>
    <button class="btn" mat-dialog-close>Close</button>
  </mat-dialog-actions>
</form>
