<div class="container">
  <div class="page-inner">
    <h3 class="fw-bold mb-3 title">{{ pageHeader }}</h3>
    <div class="card main-card">
      <div class="card-body">
        <form
          [formGroup]="snrForm"
          class="user-access-grid"
        >
          <mat-form-field
            appearance="outline"
            [ngClass]="['seniorityName-area']"
          >
            <mat-label>Training Name</mat-label>
            <input matInput formControlName="trainingName" />
          </mat-form-field>
        </form>
      </div>
    </div>
    <div class="card main-card">
      <div class="card-body">
        <div class="row">
          <div class="col-md-12">
            <p class="card-title">List of Trainings</p>
            <table mat-table [dataSource]="trainings" matSort>
              <!-- ID Column -->
              <!-- <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> Id </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
              </ng-container> -->

              <!-- Seniority Column -->
              <ng-container matColumnDef="priority">
                <th
                  mat-header-cell
                  *matHeaderCellDef
                  mat-sort-header
                  [style.background-color]="color"
                  class="header-bold"
                >
                  Priority
                </th>
                <td mat-cell *matCellDef="let element">
                  <mat-checkbox
                      (change)="onCheckboxChange(element)"
                      [checked]="isSelected(element)"
                    >
                    </mat-checkbox>
                </td>
              </ng-container>

              <!-- Level Column -->
              <ng-container matColumnDef="trainingname">
                <th
                  mat-header-cell
                  *matHeaderCellDef
                  mat-sort-header
                  [style.background-color]="color"
                  class="header-bold"
                >
                  Training Name
                </th>
                <td mat-cell *matCellDef="let element">{{ element.trainingName }}</td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>

            <!-- Paginator -->
            <mat-paginator 
            [pageSize]="pageSize"
            [length]="totalItems"
            [pageSizeOptions]="[10, 20, 30]" 
            showFirstLastButtons 
            aria-label="Select page of periodic elements"
            (page)="onPageChanged($event)"></mat-paginator>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
