<div class="modal-container">
  <div class="modal-header">
    <h2 class="modal-title">Schedule Evaluation</h2>
    <button (click)="onCancel()" class="close-button">✕</button>
  </div>

  <div class="modal-body">
    <form [formGroup]="interviewForm">

      <!-- Evaluation Type (Static Text) -->
      <div class="form-row">
        Evaluation Type
      </div>
      <div class="form-row">
        <!-- Evaluation Type Dropdown -->
        <mat-form-field appearance="fill">
          <mat-label>Evaluation Type</mat-label>
          <mat-select required formControlName="interviewType" (selectionChange)="onInterviewTypeChange($event.value)">
            <mat-option *ngFor="let option of fitmentType" [value]="option.id">
              {{ option.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Interview Type (Static Text) -->
      <div class="form-row">
        Select Profile
      </div>
      <div class="form-row">
        <!-- Profile Select Dropdown -->
        <mat-form-field appearance="fill">
          <mat-label>Profile</mat-label>
          <input type="text" matInput [formControl]="searchControl" [matAutocomplete]="auto" required>
          <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn">
            <mat-option *ngFor="let profile of filteredProfiles | async" [value]="profile">
              {{ profile.profileName }}
            </mat-option>
          </mat-autocomplete>
        </mat-form-field>
      </div>

      <!-- Evaluation Date & Time (Static Text) -->
      <div class="form-row">
        Evaluation Date & Time
      </div>
      <div class="form-row">
        <!-- Evaluation Date & Time input -->
        <mat-form-field appearance="fill">
          <mat-label>Evaluation Date & Time</mat-label>
          <input matInput mwlFlatpickr formControlName="interviewDateTime" [enableTime]="true" dateFormat="Y-m-d H:i"
            required />
        </mat-form-field>
      </div>

      <!-- CC E-mail (Static Text) -->
      <div class="form-row">
        CC E-mail
      </div>
      <div class="form-row">
        <!-- CC E-mail input -->
        <mat-form-field appearance="fill">
          <mat-label>CC E-mail</mat-label>
          <input matInput formControlName="ccEmail" />
        </mat-form-field>
      </div>

      <!-- Inline error for scheduling conflicts -->
      <div *ngIf="scheduleError" class="schedule-error-message">
        <i class="fas fa-exclamation-circle"></i>
        {{ scheduleError }}
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button (click)="onCancel()" mat-flat-button class="cancel-button">Cancel</button>
        <button mat-flat-button (click)="onSchedule()" [disabled]="isScheduleDisabled" type="submit"
          class="confirm-button">Schedule</button>
      </div>
    </form>
  </div>
</div>
