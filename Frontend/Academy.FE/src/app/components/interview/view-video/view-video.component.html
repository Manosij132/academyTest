<div class="modal-container">
  <div class="modal-header">
    <h2 class="modal-title">View Video</h2>
    <button (click)="onCancel()" class="close-button">✕</button>
  </div>

  <div class="modal-body">
    <iframe
      [src]="safeUrl"
      width="100%"
      height="100%"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>
</div>
