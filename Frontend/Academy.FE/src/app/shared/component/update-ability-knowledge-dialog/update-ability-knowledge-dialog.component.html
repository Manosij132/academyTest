<div class="modal-header">
  <h1 mat-dialog-title class="modal-heading">Update Proficiency</h1>
  <button mat-dialog-close class="btn">
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</div>

<mat-dialog-content class="mat-typography">
  <app-proficiency [employeeId]="employeeId"></app-proficiency>
</mat-dialog-content>

<hr />
<mat-dialog-actions align="end">
  <div role="alert" class="alert alert-info">
    Please note that after making any changes, the corresponding row's button
    must be clicked, as this view only supports updates on a row-by-row basis.
  </div>
  <button mat-dialog-close class="btn">Close</button>
  <!-- <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Install</button> -->
</mat-dialog-actions>
