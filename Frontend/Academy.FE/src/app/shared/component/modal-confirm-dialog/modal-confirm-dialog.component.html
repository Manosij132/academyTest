<div class="modal-header">
  <h5 mat-dialog-title>{{ data.title }}</h5>
  <button type="button" class="btn" mat-dialog-close>
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</div>
<hr />
<div class="dialog-body" style="width: 100%">
  <mat-dialog-content>
    {{ data.componentProps.description }}
  </mat-dialog-content>
  <hr />
  <mat-dialog-actions align="end">
    <button mat-button class="closeBtn" (click)="onCancel()">Cancel</button>
    <button
      style="margin-left: 5px"
      mat-button
      mat-dialog-close
      [mat-dialog-close]="dialogResult"
      cdkFocusInitial
      class="saveBtn"
    >
    Submit
    </button>
    <!-- <button
      mat-button
      mat-dialog-close
      [mat-dialog-close]="dialogResult"
      cdkFocusInitial
      class="btn"
    >
      Ok
    </button> -->
  </mat-dialog-actions>
</div>
