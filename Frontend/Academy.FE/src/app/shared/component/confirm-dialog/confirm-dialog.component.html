<div class="modal-header">
  <h5 mat-dialog-title>Confirm</h5>
  <button type="button" class="btn" mat-dialog-close>
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</div>
<div class="dialog-body" style="width: 100%">
  <mat-dialog-content>
    Are you sure you want to select or update the account, global user selection
    reset.
  </mat-dialog-content>
  <hr />
  <mat-dialog-actions align="end">
    <button mat-button class="closeBtn" (click)="onClose()">Cancel</button>
    <button mat-button class="btn btn-primary" (click)="onSave()">Ok</button>
  </mat-dialog-actions>
</div>
