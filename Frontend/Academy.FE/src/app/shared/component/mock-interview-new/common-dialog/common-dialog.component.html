<div class="dialog-header">
    <h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>
    <button 
        mat-icon-button 
        class="close-button" 
        (click)="onCancel()"
        [disabled]="isLoading"
        aria-label="Close dialog">
        <mat-icon>close</mat-icon>
    </button>
</div>

<mat-dialog-content>
    @if (data.template) {
        <ng-container *ngTemplateOutlet="data.template"></ng-container>
    } @else {
        <div [innerHTML]="safeHtmlMessage" class="dialog-message"></div>
    }
</mat-dialog-content>

@if (data.showActions !== false) {
    <mat-dialog-actions align="end">
        <button 
       
            class="cancel-btn "
            *ngIf="data.showCancel !== false" 
            (click)="onCancel()"
            [disabled]="isLoading">
            {{ data.cancelText || 'Cancel' }}
        </button>
        <button 

            class="action-btn "
            (click)="onSubmit()"
            [disabled]="isConfirmDisabled()">
            @if (isLoading) {
                <mat-spinner diameter="16" class="button-spinner"></mat-spinner>
            }
            {{ getConfirmText() }}
        </button>
    </mat-dialog-actions>
}
