<div class="modal-header">
  <h5 mat-dialog-title>{{ data.title }}</h5>
  <button type="button" class="btn" mat-dialog-close>
    <i class="fa fa-times" aria-hidden="true"></i>
  </button>
</div>
<div class="dialog-body" style="width: 100%">
  <mat-dialog-content>
    <ng-container
      *ngComponentOutlet="data.component; inputs: data.componentProps"
    ></ng-container>
  </mat-dialog-content>
  <hr />
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close class="closeBtn">Close</button>
  </mat-dialog-actions>
</div>
