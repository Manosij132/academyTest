name: Academy Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - release/**
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  dev:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-template.yml
    with:
      env_name: dev
      runner: dev
      aspnet: Development
    secrets:
      ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

  qa:
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/deploy-template.yml
    with:
      env_name: qa
      runner: qa
      aspnet: QA
    secrets:
      ENV_FILE: ${{ secrets.QA_ENV_FILE }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

  prod:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/deploy-template.yml
    with:
      env_name: prod
      runner: prod
      aspnet: Production
    secrets:
      ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}