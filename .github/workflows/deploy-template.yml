name: Deploy Template

on:
  workflow_call:
    inputs:
      env_name:
        description: "Environment name (dev/qa/prod)"
        required: true
        type: string

      runner:
        description: "Runner label (dev/qa/prod VM)"
        required: true
        type: string

      aspnet:
        description: "ASPNET environment"
        required: true
        type: string

    secrets:
      ENV_FILE:
        description: "Full .env content"
        required: true

      GOOGLE_CLIENT_ID:
        description: "Frontend Google client ID"
        required: true

jobs:
  deploy:
    name: Deploy to ${{ inputs.env_name }}
    
    runs-on:
      - self-hosted
      - linux
      - ${{ inputs.runner }}

    environment: ${{ inputs.env_name }}

    steps:

      # 🔹 Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔹 Fix permissions (optional but safe)
      - name: Fix workspace permissions
        run: sudo chown -R $(whoami):$(whoami) $GITHUB_WORKSPACE

      # 🔹 Load ENV from secret
      - name: Load ENV file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "IMAGE_TAG=${{ inputs.env_name }}-${{ github.run_number }}" >> .env
          echo "ASPNETCORE_ENVIRONMENT=${{ inputs.aspnet }}" >> .env

      # 🔹 Debug 
      - name: Debug secret
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "❌ SECRET EMPTY"
            exit 1
          else
            echo "✅ SECRET LOADED"
          fi

      # 🔹 Generate service-specific env files
      - name: Generate env files
        run: |
          chmod +x generate-env.sh
          ./generate-env.sh

      # 🔹 Build Images
      - name: Build Docker Images
        run: |
          TAG=${{ inputs.env_name }}-${{ github.run_number }}

          # 🔥 Map env (prod → production for Angular)
          if [ "${{ inputs.env_name }}" = "prod" ]; then
            BUILD_ENV=production
          else
            BUILD_ENV=${{ inputs.env_name }}
          fi

          echo "Building for ENV: $BUILD_ENV"

          docker build -t academy-api:$TAG -f Backend/Academy.API/dockerfile .
          docker build -t staffing-api:$TAG -f Backend/Staffing/Staffing.API/dockerfile .

          docker build \
            --build-arg APP_ENV=$BUILD_ENV \
            --build-arg GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            -t academy-fe:$TAG \
            -f Frontend/Academy.FE/dockerfile Frontend/Academy.FE/

      # 🔹 Stop old containers
      - name: Stop old containers
        run: docker compose down || true

      # 🔹 Start new containers
      - name: Start containers
        run: docker compose up -d

      # 🔹 Wait for services
      - name: Wait for services
        run: sleep 40

      # 🔹 Health check
      - name: Health Check
        run: |
          for i in {1..6}; do
            echo "Attempt $i..."
            curl -k -f https://localhost && exit 0
            sleep 10
          done

          echo "❌ Health check failed"
          docker ps
          docker logs academy-nginx
          docker logs academy-fe
          exit 1

      # 🔹 Done
      - name: Deployment complete
        run: echo "✅ Deployment completed for ${{ inputs.env_name }}"
