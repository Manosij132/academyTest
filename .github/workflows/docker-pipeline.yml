name: Academy Docker Deployment (Multi Env + Versioned)

on:
  push:
    branches:
      - feature/docker-infra
  workflow_dispatch:
    inputs:
      target:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - ${{ github.event.inputs.target || 'qa' }}

    steps:
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set ENV + IMAGE TAG 
      - name: Set environment variables
        run: |
          ENV_INPUT=${{ github.event.inputs.target || 'qa' }}

          echo "IMAGE_TAG=${ENV_INPUT}-${{ github.run_number }}" >> .env
          
          # 🔥 IMPORTANT FIX (frontend build issue)
          echo "APP_ENV=prod" >> .env
          
          # backend env same rahega
          echo "ASPNETCORE_ENVIRONMENT=${ENV_INPUT}" >> .env

      # 3. Verify SSL
      - name: Verify SSL certificates
        run: |
          if [ ! -f nginx/certs/fullchain.pem ] || [ ! -f nginx/certs/privkey.pem ]; then
            echo "SSL certificates missing"
            exit 1
          fi

      # 4. Debug structure (optional but useful)
      - name: Debug frontend structure
        run: |
          echo "Listing Frontend folder"
          ls -R Frontend/Academy.FE || true

      # 5. Build Images
      - name: Build Images
        run: |
          docker build -t academy-api:${{ github.run_number }} -f Backend/Academy.API/dockerfile .
          docker build -t staffing-api:${{ github.run_number }} -f Backend/Staffing/Staffing.API/dockerfile .
          docker build -t academy-fe:${{ github.run_number }} -f Frontend/Academy.FE/dockerfile Frontend/Academy.FE/

      # 6. Stop old containers
      - name: Stop containers
        run: docker compose -f $COMPOSE_FILE down || true

      # 7. Start new containers
      - name: Start containers
        run: docker compose -f $COMPOSE_FILE up -d

      # 8. Wait
      - name: Wait for services
        run: sleep 20

      # 9. Health check
      - name: Health check
        run: curl -f http://localhost:8084 || exit 1

      # 10. Done
      - name: Deployment complete
        run: echo "Deployment completed"
