name: Academy Docker Deployment (Multi Env + Versioned)

on:
  push:
    branches:
      - feature/docker-infra
  workflow_dispatch:
    inputs:
      target:
        description: "Environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

env:
  COMPOSE_FILE: docker-compose.yml

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - ${{ github.event.inputs.target || 'qa' }}

    steps:
      - name: Fix workspace permissions
        run: sudo chown -R $USER:$USER /home/azureuser/actions-runner/_work
    
      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set ENV + TAG
      - name: Set environment variables
        run: |
          ENV_INPUT=${{ github.event.inputs.target || 'qa' }}
          TAG=${ENV_INPUT}-${{ github.run_number }}

          echo "IMAGE_TAG=$TAG" >> .env
          echo "APP_ENV=prod" >> .env
          echo "ASPNETCORE_ENVIRONMENT=$ENV_INPUT" >> .env

      # 3. Verify SSL
      - name: Verify SSL certificates
        run: |
          if [ ! -f nginx/certs/fullchain.pem ] || [ ! -f nginx/certs/privkey.pem ]; then
            echo "SSL certificates missing"
            exit 1
          fi

      # 4. Build Images (🔥 FIXED)
      - name: Build Images
        run: |
          ENV_INPUT=${{ github.event.inputs.target || 'qa' }}
          TAG=${ENV_INPUT}-${{ github.run_number }}

          docker build -t academy-api:$TAG -f Backend/Academy.API/dockerfile .
          docker build -t staffing-api:$TAG -f Backend/Staffing/Staffing.API/dockerfile .
          docker build --build-arg APP_ENV=prod -t academy-fe:$TAG -f Frontend/Academy.FE/dockerfile Frontend/Academy.FE/

      # 5. Stop old containers
      - name: Stop containers
        run: docker compose -f $COMPOSE_FILE down || true

      # 6. Start containers
      - name: Start containers
        run: docker compose -f $COMPOSE_FILE up -d

      # 7. Wait
      - name: Wait for services
        run: sleep 40

      # 8. Health check
      - name: Health check
        run: |
         for i in {1..6}; do
           echo "Attempt $i..."
           curl -k -f https://localhost && exit 0
           sleep 10
         done
         docker ps
         docker logs academy-nginx
         docker logs academy-fe
         exit 1

      # 9. Done
      - name: Deployment complete
        run: echo "Deployment completed"
