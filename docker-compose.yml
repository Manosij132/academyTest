version: "3.8"

services:
  academy-api:
    image: academy-api:${IMAGE_TAG}
    container_name: academy-api
    restart: unless-stopped
    env_file:
      - academy.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: "http://+:8082"
    volumes:
      - academy_logs:/app/logs
    ports:
      - "8082:8082"

  staffing-api:
    image: staffing-api:${IMAGE_TAG}
    container_name: staffing-api
    restart: unless-stopped
    env_file:
      - staffing.env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: "http://+:8081"
      Logging__FileLog__FolderPath: "/app/logs"
    volumes:
      - staffing_logs:/app/logs
    ports:
      - "8081:8081"

  academy-fe:
    image: academy-fe:${IMAGE_TAG}
    container_name: academy-fe
    restart: unless-stopped
    env_file:
      - fe.env
    ports:
      - "4000:4000"

  nginx:
    image: nginx:alpine
    container_name: academy-nginx
    restart: unless-stopped
    ports:
      - "8084:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - academy-api
      - staffing-api
      - academy-fe

  prometheus:
    image: prom/prometheus:v2.53.2
    volumes:
      - ./Monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.5
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  academy_logs:
  staffing_logs:
  nginx_logs:
  prometheus-data:
  grafana-data: