# =======================================================
# docker-compose.yml — Academy Production Stack
# Description: Main Docker Compose configuration for the Academy application.
#              This file orchestrates the .NET APIs, Angular frontend, background
#              workers, and the complete monitoring stack (Prometheus, Grafana,
#              Loki, Promtail, cAdvisor).
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
# ASPNETCORE_ENVIRONMENT=Production DOTNET_ENVIRONMENT=Production APP_ENV=prod  docker compose up --build -d 
# ASPNETCORE_ENVIRONMENT=Development DOTNET_ENVIRONMENT=Development APP_ENV=dev  docker compose up --build -d 
# ASPNETCORE_ENVIRONMENT=QA DOTNET_ENVIRONMENT=QA APP_ENV=qa  docker compose up --build -d  
# ASPNETCORE_ENVIRONMENT=local DOTNET_ENVIRONMENT=local APP_ENV=local  docker compose up --build -d 
# =======================================================

services:
  # ─────────────────────────────────────────────────────
  # Academy.API — The core web API handling
  # ─────────────────────────────────────────────────────
  academy-api:
    build:
      context: .                                        # repo root
      dockerfile: Backend/Academy.API/dockerfile
    image: academy-api:latest
    container_name: academy-api
    restart: unless-stopped
    # depends_on:
    #   mssql:
    #     condition: service_healthy

    environment:
      # Pass the variable directly to the container at runtime
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: "http://+:8082"

    volumes:
      - academy_logs:/app/logs    # internal only — Nginx proxies this
    ports:
        - "8082:8082"                  # expose on host for testing; remove in production

  # ─────────────────────────────────────────────────────
  # Staffing.API - The Web API handling Staffing operations with ollam call
  # ─────────────────────────────────────────────────────
  staffing-api:
    build:
      context: .
      dockerfile: Backend/Staffing/Staffing.API/dockerfile
    image: staffing-api:latest
    container_name: staffing-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: "http://+:8081"  
      Logging__FileLog__FolderPath: "/app/logs"

    volumes:
      - staffing_logs:/app/logs
    ports:
        - "8081:8081"                  # expose on host for testing; remove in production

  # ─────────────────────────────────────────────────────
  # Academy.FE — Angular SSR frontend
  # ─────────────────────────────────────────────────────
  academy-fe:
    build:
      context: Frontend/Academy.FE
      dockerfile: dockerfile
      args:
        APP_ENV: ${APP_ENV:-development}

    image: academy-fe:latest
    container_name: academy-fe
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      -  "4000:4000"                       # internal SSR express port
    volumes:
      - academfe_logs:/app/logs

  # ─────────────────────────────────────────────────────
  # Nginx — reverse proxy + TLS termination
  # ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: academy-nginx
    restart: unless-stopped
    # depends_on:
    #   academy-api:
    #     condition: service_healthy
    #   staffing-api:
    #     condition: service_healthy
    #   academy-fe:
    #     condition: service_healthy
    ports:
      - "8084:80"
     # - "9200:443"
      - "443:443" # for local docker setup
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # mount your SSL certs here
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────────────
  # prometheus — Prometheus server for scraping and storing time-series metrics
  # ─────────────────────────────────────────────────────
  prometheus:
      image: prom/prometheus:v2.53.2
      container_name: academy-prometheus
      command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--web.enable-lifecycle"
      volumes:
        - ./Monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus-data:/prometheus
      ports:
        - "9090:9090"
      depends_on:
        - cadvisor 
  
  # ─────────────────────────────────────────────────────
  # cAdvisor for monitoring Docker container resource usage and performance metrics
  # ─────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: academy-cadvisor
    privileged: true
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
  
  # ─────────────────────────────────────────────────────
  # Grafana server for visualizing metrics and logs on dashboards
  # ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.5
    container_name: academy-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
  # ─────────────────────────────────────────────────────
  # loki —   The log database (the "server")
  # ─────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.1.1
    container_name: academy-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  # ─────────────────────────────────────────────────────
  # promtail — The agent that ships logs from the host to Loki
  # ─────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:3.1.1
    container_name: academy-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/tmp
    depends_on:
      - loki

# ─────────────────────────────────────────────────────
# Named volumes (persist data across container restarts)
# ─────────────────────────────────────────────────────
volumes:
  academy_logs:
  staffing_logs:
  academfe_logs:
  nginx_logs: 
  prometheus-data:
  grafana-data:
  loki-data:
  promtail-data:


