# =======================================================
# nginx/nginx.conf — Reverse proxy for Academy stack
# Handles HTTP→HTTPS redirect, SSL termination, and
# routing to backend containers.
#
# SSL certs location (map via Docker volume):
#   ./nginx/certs/fullchain.pem
#   ./nginx/certs/privkey.pem
#
# For Let's Encrypt / Certbot, replace cert paths with
# /etc/letsencrypt/live/<domain>/ and mount that directory.
# =======================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    sendfile        on;
    keepalive_timeout  65;

    # ── Gzip compression ─────────────────────────────
    gzip  on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ── Global Security headers ─────────────────────────────
    
    # [SECURITY] Prevents Clickjacking by disallowing the site to be rendered in an iframe on other domains.
    add_header X-Frame-Options           "SAMEORIGIN"                       always;
    
    # [SECURITY] Prevents MIME-sniffing. Stops malicious user uploads (like a JS file disguised as an image) from being executed.
    add_header X-Content-Type-Options    "nosniff"                          always;
    
    # [SECURITY] Restricts referrer information sent in headers. Protects user privacy when crossing origins.
    add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;

    # [SECURITY] Content Security Policy (CSP). The strongest defense against XSS.
    # Restricts executable scripts and styles exclusively to this origin ('self').
    add_header Content-Security-Policy "
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self';
    frame-ancestors 'self';" always;

    # ── Upstream definitions ──────────────────────────
    upstream academy_api {
        server academy-api:8082;
    }

    upstream staffing_api {
        server staffing-api:8081;
    }

    upstream academy_fe {
        server academy-fe:4000;
    }

    # ── HTTPS — Academy.API (main domain) ────────────
    server {
        listen 443 ssl http2;
        server_name nce6822dxu06.tat.corp.globant.com;
        # server_name _;                     # replace with your domain

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # ── Modern TLS & Cryptography Settings ──
        
        # [SECURITY] Enforce modern TLS protocols (v1.2 and v1.3). Refuse vulnerable legacy protocols (SSLv3/TLSv1).
        ssl_protocols       TLSv1.2 TLSv1.3;
        
        # [SECURITY] Enforce a high-strength cipher suite. Explicitly reject weak ciphers like MD5.
        ssl_ciphers         HIGH:!aNULL:!MD5;
        
        # [SECURITY] Force the server's ciphers over the client's ciphers to prevent downgrade attacks during handshake.
        ssl_prefer_server_ciphers on;
        
        # [SECURITY] Cache SSL parameters to reduce CPU load on handshakes.
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # [SECURITY] Disable SSL session tickets to guarantee Perfect Forward Secrecy (PFS).
        ssl_session_tickets off;

        # [SECURITY] HTTP Strict-Transport-Security (HSTS). Forces the browser to strictly use HTTPS for 1 year.
        # Placed here in the HTTPS server block, as it is invalid/ignored over port 80 HTTP.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 50M;

        # [SECURITY] Hide backend server signatures from being leaked. 
        # (e.g., Kestrel/ASP.NET Core signature from the APIs).
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # ── Academy API routes ──
        location /api/ {
            proxy_pass         http://academy_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # Swagger UI for Academy.API
        location /swagger {
            proxy_pass         http://academy_api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Academy Frontend routes ──
        location / {
            proxy_pass         http://academy_fe;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection keep-alive;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Staffing API routes ──
        location /staffing/ {
            proxy_pass         http://staffing_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
